    DCEPO3013:
      mcbsCode: '30O3002'
      mcbsMsg: 'the payee institution is faulty'
    DCEPO3018:
      mcbsCode: '30O3003'
      mcbsMsg: 'the sending institution is faulty'
    DCEPO3022:
      mcbsCode: '30O3004'
      mcbsMsg: 'the receiving institution is faulty'
    DCEPO1036:
